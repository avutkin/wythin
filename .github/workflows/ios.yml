name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────────
  test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Don't pin an Xcode version: the image's default Xcode is the one whose
      # SDK matches the simulator runtimes actually installed on it. Pinning
      # Xcode 16 left the SDK with no usable runtime and testing never ran.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # Naming a device model pins us to whatever shipped with one Xcode (the
      # old 'iPhone 16' pin is already gone from current Xcodes). Resolve the
      # newest available iPhone on the image instead and address it by UDID.
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in runtimes.items():
              if "iOS" not in runtime:
                  continue
              ver = tuple(int(p) for p in runtime.split(".iOS-")[-1].split("-") if p.isdigit())
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      key = (ver, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d)
          if best is None:
              sys.exit("no available iPhone simulator")
          print(best[1]["udid"])
          ')
          echo "Selected simulator: $(xcrun simctl list devices | grep "$UDID")"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # `| xcpretty` masks xcodebuild's exit code, so a failing test suite used
      # to report success and let the TestFlight job through. pipefail fixes it.
      - name: Build & run unit tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Wythin.xcodeproj \
            -scheme Wythin \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  # ── Archive & TestFlight (main branch only) ─────────────────────────────────
  testflight:
    name: Archive → TestFlight
    needs: test
    runs-on: macos-15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Signing is fully automatic: Xcode fetches (or creates) the distribution
    # certificate and provisioning profile itself using the App Store Connect
    # API key, so there is no .p12 or .mobileprovision to keep in secrets.
    # Requires repo secrets: APPSTORE_ISSUER_ID, APPSTORE_KEY_ID,
    # APPSTORE_PRIVATE_KEY (the raw .p8 contents), APPLE_TEAM_ID.
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      # An unset secret expands to an empty string, which otherwise surfaces as
      # a cryptic failure several steps later. Fail here, naming the secret.
      - name: Check required secrets are present
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ]      || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ]   || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$ASC_PRIVATE_KEY" ] || missing="$missing APPSTORE_PRIVATE_KEY"
          [ -n "$TEAM_ID" ]         || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — set them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All four App Store Connect secrets are present."

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # TestFlight rejects a build number it has already seen, and the project
      # pins CURRENT_PROJECT_VERSION = 1. github.run_number is monotonic per
      # workflow and already past the builds uploaded by hand from Xcode.
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/Wythin.xcodeproj \
            -scheme Wythin \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Wythin.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Wythin.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up API key
        if: always()
        run: rm -f "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
