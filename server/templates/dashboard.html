<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wythin · User Activity</title>
<style>
  :root {
    --bg: #0c0c0c; --card: #171717; --surface: #1f1f1f; --border: #2a2a2a;
    --text: #ffffff; --dim: #8a8a8a; --accent: #00e5a0; --warn: #ff6b6b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f8; --card: #ffffff; --surface: #eef0f2; --border: #e0e3e6;
      --text: #101418; --dim: #667080; --accent: #00b981;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h1 .dot { color: var(--accent); }
  .sub { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .spacer { flex: 1; }
  .controls { display: flex; gap: 8px; align-items: center; }
  select, button {
    font-family: var(--mono); font-size: 12px; color: var(--text);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 12px; margin: 22px 0; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .kpi .label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
                text-transform: uppercase; color: var(--dim); }
  .kpi .value { font-size: 27px; font-weight: 650; margin-top: 6px;
                font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .kpi .value small { font-size: 13px; color: var(--dim); font-weight: 500; margin-left: 2px; }

  .panel { background: var(--card); border: 1px solid var(--border);
           border-radius: 16px; padding: 18px; margin-bottom: 20px; }
  .panel h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
              color: var(--dim); margin: 0 0 14px; font-family: var(--mono); font-weight: 600; }

  .chart { width: 100%; height: 220px; display: block; }
  .chart .bar { fill: var(--accent); opacity: .82; }
  .chart .bar:hover { opacity: 1; }
  .chart .axis { stroke: var(--border); stroke-width: 1; }
  .chart .tick { fill: var(--dim); font: 10px var(--mono); }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 9px 12px; white-space: nowrap;
           border-bottom: 1px solid var(--border); font-size: 13px; }
  th:first-child, td:first-child { text-align: left; }
  th { font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em;
       text-transform: uppercase; color: var(--dim); cursor: pointer; user-select: none; }
  th:hover { color: var(--accent); }
  th .arrow { opacity: .5; font-size: 9px; }
  td .device { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  td .name { font-weight: 550; }
  tr:hover td { background: var(--surface); }
  .muted { color: var(--dim); }

  #gate { position: fixed; inset: 0; background: rgba(0,0,0,.72);
          display: none; align-items: center; justify-content: center; padding: 20px; }
  #gate.show { display: flex; }
  #gate .box { background: var(--card); border: 1px solid var(--border);
               border-radius: 16px; padding: 26px; width: 100%; max-width: 380px; }
  #gate h3 { margin: 0 0 6px; font-size: 16px; }
  #gate p { margin: 0 0 16px; color: var(--dim); font-size: 13px; }
  #gate input { width: 100%; font-family: var(--mono); font-size: 14px; color: var(--text);
                background: var(--surface); border: 1px solid var(--border);
                border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  #gate button.primary { width: 100%; background: var(--accent); color: #06231a;
                         border: none; font-weight: 650; padding: 11px; font-size: 13px; }
  #gate .err { color: var(--warn); font-size: 12px; min-height: 16px; font-family: var(--mono); }
  .empty { text-align: center; color: var(--dim); padding: 40px; font-family: var(--mono); font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Wythin<span class="dot"> ·</span> User Activity</h1>
      <span class="sub" id="updated"></span>
      <span class="spacer"></span>
      <div class="controls">
        <select id="range">
          <option value="30">Last 30 days</option>
          <option value="90" selected>Last 90 days</option>
          <option value="365">Last year</option>
        </select>
        <button id="refresh" title="Refresh">↻</button>
        <button id="changeKey" title="Change API key">🔑</button>
      </div>
    </header>

    <div class="kpis" id="kpis"></div>

    <div class="panel">
      <h2>Sessions per day</h2>
      <svg class="chart" id="chart" preserveAspectRatio="none"></svg>
    </div>

    <div class="panel">
      <h2>Users</h2>
      <div class="tablewrap"><table id="table"></table></div>
    </div>
  </div>

  <div id="gate">
    <div class="box">
      <h3>Admin key required</h3>
      <p>Enter the server <code>X-API-Key</code> to load activity. It's stored only in this browser.</p>
      <input id="keyInput" type="password" placeholder="X-API-Key" autocomplete="off" />
      <div class="err" id="keyErr"></div>
      <button class="primary" id="keySubmit">Unlock</button>
    </div>
  </div>

<script>
(() => {
  const KEY_STORE = "wythin_admin_key";
  const $ = (s) => document.querySelector(s);
  const fmt = (n, d = 0) => (n == null ? "—" : Number(n).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d }));
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { year: "2-digit", month: "short", day: "numeric" }) : "—";
  const ago = (iso) => {
    if (!iso) return "never";
    const days = (Date.now() - new Date(iso)) / 86400000;
    if (days < 1) return "today";
    if (days < 2) return "yesterday";
    if (days < 30) return Math.floor(days) + "d ago";
    return fmtDate(iso);
  };

  let sortKey = "last_seen", sortDir = -1, lastData = null;

  const getKey = () => localStorage.getItem(KEY_STORE) || "";
  const setKey = (k) => localStorage.setItem(KEY_STORE, k);

  async function load() {
    const days = $("#range").value;
    let res;
    try {
      res = await fetch(`stats?days=${days}`, { headers: { "X-API-Key": getKey() } });
    } catch (e) {
      return showGate("Network error — is the server reachable?");
    }
    if (res.status === 401) return showGate(getKey() ? "That key was rejected." : "");
    if (!res.ok) return showGate("Server error " + res.status);
    hideGate();
    lastData = await res.json();
    render(lastData);
    $("#updated").textContent = "updated " + new Date().toLocaleTimeString();
  }

  function render(d) {
    const k = d.kpis;
    const cards = [
      ["Total users", fmt(k.total_users)],
      ["Active · 7d", fmt(k.active_7d)],
      ["Active · 30d", fmt(k.active_30d)],
      ["Total sessions", fmt(k.total_sessions)],
      ["Practice minutes", fmt(k.total_minutes)],
      ["Avg session", fmt(k.avg_session_min, 1) + " <small>min</small>"],
    ];
    $("#kpis").innerHTML = cards.map(([l, v]) =>
      `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("");
    drawChart(d.sessions_per_day || []);
    drawTable(d.users || []);
  }

  function drawChart(series) {
    const svg = $("#chart");
    const W = svg.clientWidth || 900, H = 220, pad = { l: 34, r: 8, t: 10, b: 22 };
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    if (!series.length) { svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" class="tick">no sessions in range</text>`; return; }
    const max = Math.max(1, ...series.map(s => s.sessions));
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const bw = iw / series.length;
    const y = (v) => pad.t + ih - (v / max) * ih;
    let el = "";
    // y gridlines (0, max)
    [0, max].forEach(v => {
      const yy = y(v);
      el += `<line class="axis" x1="${pad.l}" y1="${yy}" x2="${W - pad.r}" y2="${yy}" opacity="0.4"/>`;
      el += `<text class="tick" x="${pad.l - 6}" y="${yy + 3}" text-anchor="end">${v}</text>`;
    });
    series.forEach((s, i) => {
      const bh = ih - (y(s.sessions) - pad.t);
      const x = pad.l + i * bw;
      el += `<rect class="bar" x="${x + bw*0.12}" y="${y(s.sessions)}" width="${Math.max(1, bw*0.76)}" height="${Math.max(0, bh)}" rx="1.5"><title>${s.day}: ${s.sessions}</title></rect>`;
    });
    // x labels: first, middle, last
    [0, Math.floor(series.length/2), series.length-1].forEach(i => {
      const x = pad.l + i * bw + bw/2;
      el += `<text class="tick" x="${x}" y="${H - 6}" text-anchor="middle">${series[i].day.slice(5)}</text>`;
    });
    svg.innerHTML = el;
  }

  const COLS = [
    { k: "display_name", label: "User", cell: (u) => `<span class="name">${u.display_name || "—"}</span><br><span class="device">${(u.device_id||"").slice(0,12) || u.id.slice(0,8)}</span>` },
    { k: "first_seen", label: "First seen", cell: (u) => fmtDate(u.first_seen) },
    { k: "last_seen", label: "Last seen", cell: (u) => ago(u.last_seen) },
    { k: "session_count", label: "Sessions", cell: (u) => fmt(u.session_count) },
    { k: "total_minutes", label: "Minutes", cell: (u) => fmt(u.total_minutes, 0) },
    { k: "avg_coherence", label: "Avg coherence", cell: (u) => u.avg_coherence == null ? "—" : fmt(u.avg_coherence, 2) },
    { k: "avg_rsa", label: "Avg RSA", cell: (u) => u.avg_rsa == null ? "—" : fmt(u.avg_rsa, 1) },
  ];

  function drawTable(users) {
    const t = $("#table");
    if (!users.length) { t.innerHTML = `<tr><td class="empty" colspan="${COLS.length}">no users yet</td></tr>`; return; }
    const sorted = [...users].sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (av == null) return 1; if (bv == null) return -1;
      return (av > bv ? 1 : av < bv ? -1 : 0) * sortDir;
    });
    const head = "<tr>" + COLS.map(c =>
      `<th data-k="${c.k}">${c.label}${sortKey === c.k ? ` <span class="arrow">${sortDir < 0 ? "▼" : "▲"}</span>` : ""}</th>`).join("") + "</tr>";
    const body = sorted.map(u => "<tr>" + COLS.map(c => `<td>${c.cell(u)}</td>`).join("") + "</tr>").join("");
    t.innerHTML = head + body;
    t.querySelectorAll("th").forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
      drawTable(users);
    });
  }

  function showGate(msg) { $("#gate").classList.add("show"); $("#keyErr").textContent = msg || ""; $("#keyInput").focus(); }
  function hideGate() { $("#gate").classList.remove("show"); }

  $("#keySubmit").onclick = () => { const v = $("#keyInput").value.trim(); if (v) setKey(v); load(); };
  $("#keyInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#keySubmit").click(); });
  $("#changeKey").onclick = () => { $("#keyInput").value = getKey(); showGate(""); };
  $("#refresh").onclick = load;
  $("#range").onchange = load;

  load();
})();
</script>
</body>
</html>
